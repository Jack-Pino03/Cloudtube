<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudTube</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="Style index.css">
  
  <style>
    /* Sidebar hover animation */
    .sidebar a {
      transition: all 0.3s ease;
    }
    .sidebar a:hover {
      background-color: #0dcaf0; /* Un azzurro più scuro */
      color: white;
      border-radius: 10px;
      padding-left: 10px;
    }

    /* Navbar shadow */
    .navbar {
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    /* Footer */
    footer {
      background-color: #212529;
      color: white;
      padding: 20px 0;
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #e0e0e0;
      }
      .sidebar {
        background-color: #1f1f1f !important;
      }
      .navbar, footer {
        background-color: #000 !important;
      }
    }
  </style>
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <img src="Immagini/Cloudtube-logo.png" alt="CloudTube Logo" width="45" height="45" class="d-inline-block align-text-top">
      CloudTube
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Canali</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Tendenze</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Altri siti</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Sidebar + Content Layout -->
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 d-none d-md-block bg-info sidebar py-4">
      <div class="position-sticky">
        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <a class="nav-link text-light" href="#home">🏠 Home</a>
          </li>
          <li class="nav-item mb-2">
            <a class="nav-link text-light" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">🎥 Video</a>
          </li>
          <li class="nav-item mb-2">
            <a class="nav-link text-light" href="https://www.youtube.com/watch?v=zOy6pdGXVxQ">📦 Roba</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="https://www.youtube.com/watch?v=ooOELrGMn14">✨ Ciofetti</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 d-flex justify-content-center align-items-center" style="height: 80vh;">
      <div class="text-center">
        <button class="btn btn-lg shadow"><img src="Immagini/Foto CV.jpg" alt="Gay" width=20% height=20%>
        </button>
      </div>
    </main>

  </div>
</div>

<!-- Footer -->
<footer class="text-center mt-auto">
  <div class="container">
    <p class="mb-0">&copy; 2025 CloudTube. Tutti i diritti riservati.<br> Sesso droga e rock & roll</p>
  </div>
</footer>

</body>
</html>
